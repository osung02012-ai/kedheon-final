<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#08251c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>월남뽕 · K-Hwatu Between</title>
<meta name="description" content="금박 숫자(1~12) 전통 화투로 30초 만에 즐기는 K-심리 카드 게임 — 두 패 사이를 쪼아 맞히는 룰. A 30-second Korean traditional card game by XAEA12." />
<style>
:root{
  --gold:#e6c37c;--gold-d:#a8842f;--red:#b3231c;--cream:#fdf7e8;
  --ink:#f6eeda;--muted:#9fb5aa;--win:#7fe0a0;--lose:#ff9489;
  --felt1:#14614a;--felt2:#0a3a2c;--felt3:#06251b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:#04110d;color:var(--ink);
  font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;justify-content:center;overflow:hidden;
  user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased;
}
#app{
  position:relative;width:100%;max-width:430px;height:100vh;height:100dvh;
  display:flex;flex-direction:column;
  padding:calc(7px + env(safe-area-inset-top)) 12px calc(6px + env(safe-area-inset-bottom));
  background:radial-gradient(120% 70% at 50% 0%,#0f3b2e 0%,#082319 55%,#04120e 100%);
  overflow:hidden;
}
/* ---------- top bar ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:2px 2px 4px;flex:0 0 auto}
.brand{display:flex;flex-direction:column;line-height:1;min-width:0}
.brand b,.brand span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand b{font-size:17px;font-weight:900;letter-spacing:2.5px;color:#f8f1e0}
.brand span{font-size:8px;letter-spacing:2.2px;color:var(--gold);margin-top:3px;opacity:.85}
.tools{display:flex;gap:6px;flex:0 0 auto}
.tbtn{
  border:1px solid rgba(230,195,124,.42);background:rgba(255,255,255,.05);color:#f6eeda;
  font-size:11px;font-weight:800;padding:6px 10px;border-radius:999px;letter-spacing:.6px;
  font-family:inherit;cursor:pointer;transition:transform .12s,background .15s;
}
.tbtn:active{transform:scale(.94);background:rgba(255,255,255,.12)}
.tbtn.back{font-size:10px;padding:6px 8px;letter-spacing:0;text-decoration:none;display:inline-flex;align-items:center;gap:3px;opacity:.82}
/* 좁은 화면(Pi Browser·360px 대) — 복귀 링크는 ← 기호만, 브랜드 부제는 축소 */
@media (max-width:400px){
  .tbtn.back .lbl{display:none}
  .tbtn.back{padding:6px 7px}
  .brand b{font-size:15px;letter-spacing:1.8px}
  .brand span{font-size:7px;letter-spacing:1px}
  .hero h1{font-size:21px;letter-spacing:4px}
}
/* ---------- screens ---------- */
.screen{display:none;flex:1 1 auto;min-height:0;flex-direction:column;gap:7px}
.screen.on{display:flex}
#scr-setup{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#scr-setup::-webkit-scrollbar{display:none}
/* ---------- setup ---------- */
.hero{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:2px}
.hero-cards{display:flex;justify-content:center;align-items:flex-end;height:78px;margin-bottom:2px}
.hero-cards .card{width:43.5px;aspect-ratio:120/186;height:67.5px;margin:0 -7px;transform-origin:50% 100%}
.hero h1{font-size:24px;letter-spacing:7px;font-weight:900;color:#fbf4e2;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.hero .official{font-size:10px;font-weight:800;letter-spacing:2.6px;color:var(--gold);opacity:.92;margin-top:1px;text-align:center}
.hero .sub{font-size:11px;color:var(--muted);letter-spacing:.2px;text-align:center;max-width:330px;line-height:1.45}
.modes{display:flex;gap:6px}
.mode{
  flex:1;display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center;
  padding:9px 4px;border-radius:13px;border:1px solid rgba(230,195,124,.22);
  background:rgba(255,255,255,.04);color:var(--ink);font-family:inherit;cursor:pointer;
  transition:.16s;min-height:52px;
}
.mode b{font-size:12px;font-weight:800;letter-spacing:.2px}
.mode span{font-size:9px;color:var(--muted)}
.mode.on{border-color:var(--gold);background:linear-gradient(180deg,rgba(230,195,124,.22),rgba(230,195,124,.07));box-shadow:0 0 0 1px rgba(230,195,124,.25) inset}
.mode.on b{color:#ffeec4}
.setupbox{display:flex;flex-direction:column;gap:7px;background:rgba(0,0,0,.22);border:1px solid rgba(230,195,124,.14);border-radius:14px;padding:10px 11px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;color:#dfd8c6}
.stepper{display:flex;align-items:center;gap:9px}
.stepper button{width:26px;height:26px;border-radius:8px;border:1px solid rgba(230,195,124,.35);background:rgba(255,255,255,.06);color:var(--ink);font-size:15px;line-height:1;font-family:inherit;cursor:pointer}
.stepper b{min-width:16px;text-align:center;font-size:13px;color:#ffeec4}
.seg{display:flex;gap:4px}
.seg button{
  min-width:34px;padding:5px 8px;border-radius:8px;border:1px solid rgba(230,195,124,.28);
  background:rgba(255,255,255,.05);color:#e8dfc9;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;
}
.seg button.on{background:linear-gradient(180deg,#e6c37c,#c99f4b);color:#2a1b06;border-color:#f0d79a}
.switch{width:42px;height:23px;border-radius:999px;background:rgba(255,255,255,.14);position:relative;border:none;cursor:pointer;transition:.2s;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:linear-gradient(90deg,#a8842f,#e6c37c)}
.switch.on::after{left:22px}
.names{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.names input{
  width:100%;padding:7px 9px;border-radius:9px;border:1px solid rgba(230,195,124,.2);
  background:rgba(255,255,255,.05);color:#fff8e6;font-size:11.5px;font-family:inherit;
}
.names input:focus{outline:none;border-color:var(--gold)}
.start{
  margin-top:2px;padding:14px;border-radius:14px;border:none;cursor:pointer;
  background:linear-gradient(180deg,#e9c983,#c19234);color:#2a1b06;font-size:15px;font-weight:900;
  letter-spacing:2px;font-family:inherit;box-shadow:0 6px 18px rgba(230,195,124,.22);
}
.start:active{transform:scale(.985)}
.rules{font-size:9.5px;line-height:1.55;color:#8fa79b;text-align:center;padding:0 4px}
/* ---------- online room ---------- */
.onlinebox{display:flex;flex-direction:column;gap:7px;border-top:1px dashed rgba(230,195,124,.18);padding-top:8px;margin-top:2px}
.orow{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#dfd8c6}
.orow span{flex:0 0 auto}
.onlineInput{flex:1;min-width:0;padding:8px 9px;border-radius:10px;border:1px solid rgba(230,195,124,.25);background:rgba(255,255,255,.05);color:#fff8e6;font-size:12px;font-family:inherit}
.onlineInput:focus{outline:none;border-color:var(--gold)}
.orline{display:flex;align-items:center;gap:8px;color:#7f9488;font-size:9.5px;text-align:center}
.orline::before,.orline::after{content:"";flex:1;height:1px;background:rgba(230,195,124,.16)}
.codrow{display:flex;gap:6px}
.codrow input{flex:1;min-width:0;padding:8px;border-radius:10px;border:1px solid rgba(230,195,124,.28);background:rgba(255,255,255,.05);color:#fff8e6;font-size:18px;font-weight:900;letter-spacing:7px;text-align:center;font-family:inherit}
.codrow input:focus{outline:none;border-color:var(--gold)}
.lhint{font-size:9.5px;line-height:1.5;color:#8fa79b;text-align:center}
.lobby{display:flex;flex-direction:column;gap:8px;flex:1 1 auto;min-height:0;overflow-y:auto;padding-top:2px}
.lobby .lk{font-size:9.5px;letter-spacing:2.4px;color:var(--gold-d);font-weight:800;text-align:center}
.lobby .code{font-size:42px;font-weight:900;letter-spacing:11px;text-align:center;color:#ffeec4;text-shadow:0 2px 14px rgba(230,195,124,.35);font-variant-numeric:tabular-nums;padding-left:11px}
.lobbyList{display:flex;flex-direction:column;gap:4px;background:rgba(0,0,0,.22);border:1px solid rgba(230,195,124,.14);border-radius:14px;padding:8px;min-height:56px}
.lp{display:flex;align-items:center;gap:7px;font-size:12px;color:#e9e2cf;padding:5px 7px;border-radius:9px}
.lp.host{background:rgba(230,195,124,.12);border:1px solid rgba(230,195,124,.3)}
.lp .av{font-size:13px;line-height:1}
.lp .tag2{margin-left:auto;font-size:8.5px;color:var(--gold);font-weight:800;letter-spacing:1px}
.lp .me{font-size:9px;color:#8fd6b4;font-weight:700}
.connbar{position:absolute;left:0;right:0;top:0;padding:5px 8px;font-size:9.5px;text-align:center;background:rgba(120,24,18,.94);color:#fff;z-index:30;display:none;letter-spacing:.2px}
/* ---------- game ---------- */
.statusbar{display:flex;align-items:center;justify-content:space-between;flex:0 0 auto;padding:0 2px}
.pot{display:flex;align-items:baseline;gap:6px;position:relative}
.pot>span{font-size:9px;letter-spacing:2px;color:var(--gold-d);font-weight:800}
.pot>b{
  font-size:22px;font-weight:900;letter-spacing:.5px;
  background:linear-gradient(180deg,#ffe9b6,#e0b45c);-webkit-background-clip:text;background-clip:text;color:transparent;
  font-variant-numeric:tabular-nums;
}
.pot.up>b{animation:potpop .7s ease}
@keyframes potpop{0%{transform:scale(1)}30%{transform:scale(1.22)}100%{transform:scale(1)}}
.meta{display:flex;align-items:center;gap:7px}
.deckbadge{display:flex;align-items:center;gap:4px;font-size:10px;color:#cfe0d8;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);padding:4px 7px;border-radius:8px;font-variant-numeric:tabular-nums}
.deckbadge i{width:9px;height:13px;border-radius:2px;background:linear-gradient(160deg,#8d1a16,#5d100d);border:1px solid #2c0705;display:inline-block}
.turnbadge{font-size:10.5px;font-weight:800;padding:5px 9px;border-radius:999px;background:rgba(230,195,124,.14);border:1px solid rgba(230,195,124,.4);color:#ffeec4;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.players{display:flex;gap:5px;flex:0 0 auto;overflow-x:auto;scrollbar-width:none;padding:1px 0}
.players::-webkit-scrollbar{display:none}
.pl{
  flex:1 1 0;min-width:46px;display:flex;flex-direction:column;align-items:center;gap:1px;
  padding:4px 2px;border-radius:10px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);
  transition:.2s;position:relative;
}
.pl.on{background:linear-gradient(180deg,rgba(230,195,124,.24),rgba(230,195,124,.06));border-color:rgba(230,195,124,.65);box-shadow:0 0 12px rgba(230,195,124,.22)}
.pl.dead{opacity:.4}
.pl .av{font-size:12px;line-height:1}
.pl .nm{font-size:8.5px;color:#dfd8c6;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .ch{font-size:10px;font-weight:800;color:#ffe9b6;font-variant-numeric:tabular-nums}
.pl .tag{position:absolute;top:-6px;right:-2px;font-size:10px}
/* ---------- table ---------- */
.table{
  flex:1 1 auto;min-height:0;position:relative;border-radius:18px;padding:9px 8px 6px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  background:
    radial-gradient(120% 90% at 50% 0%,var(--felt1) 0%,var(--felt2) 62%,var(--felt3) 100%);
  box-shadow:inset 0 0 0 1px rgba(230,195,124,.2),inset 0 0 46px rgba(0,0,0,.55),0 10px 24px rgba(0,0,0,.4);
  overflow:hidden;
}
.table::before{
  content:"";position:absolute;inset:0;opacity:.06;pointer-events:none;
  background:repeating-linear-gradient(45deg,#fff 0 1px,transparent 1px 4px);
}
.board{display:flex;align-items:center;justify-content:center;gap:9px;flex:0 0 auto;z-index:1}
.slot{width:min(16.08vw,11.82vh);aspect-ratio:120/186;height:min(24.93vw,18.33vh);animation:deal .35s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes deal{from{opacity:0;transform:translateY(-14px) scale(.9) rotate(-3deg)}to{opacity:1;transform:none}}
.range{
  display:flex;flex-direction:column;align-items:center;gap:1px;min-width:46px;
  padding:5px 4px;border-radius:10px;background:rgba(0,0,0,.28);border:1px solid rgba(230,195,124,.2);
}
.range b{font-size:12px;color:#ffeec4;letter-spacing:.5px;font-variant-numeric:tabular-nums}
.range span{font-size:9px;color:#8fd6b4;font-weight:800}
.range.nogap b{color:var(--lose)}
.range.nogap span{color:var(--lose)}
.stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;z-index:2}
.thirdwrap{
  position:relative;width:min(29.33vw,20.82vh);aspect-ratio:120/186;height:min(45.47vw,32.27vh);touch-action:none;
  transition:transform .25s ease;filter:drop-shadow(0 10px 16px rgba(0,0,0,.5));
}
.thirdwrap.pop{animation:pop .45s cubic-bezier(.2,.9,.3,1.4)}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.08)}100%{transform:scale(1)}}
.thirdface{position:absolute;inset:0;border-radius:10px;overflow:hidden}
.cover{
  position:absolute;inset:0;border-radius:10px;overflow:hidden;
  transition:clip-path .28s ease,transform .28s ease,opacity .3s;
  transform-origin:50% 100%;will-change:clip-path,transform;
  box-shadow:0 3px 10px rgba(0,0,0,.45);
}
.cover svg{display:block;width:100%;height:100%}
.cover.off{clip-path:none;transform:translateY(-125%) rotate(-10deg);opacity:0;transition:transform .5s cubic-bezier(.2,.9,.25,1),opacity .45s}
.thirdwrap.peeked .cover{box-shadow:0 6px 16px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.16)}
.thirdwrap.shake{animation:shake .55s ease-in-out infinite}
@keyframes shake{0%,100%{transform:rotate(-1.2deg) scale(1.01)}50%{transform:rotate(1.2deg) scale(1.01)}}
.peekhint{
  font-size:10px;color:#d8e8df;letter-spacing:.3px;display:flex;align-items:center;gap:4px;
  background:rgba(0,0,0,.3);padding:4px 9px;border-radius:999px;border:1px solid rgba(255,255,255,.1);
}
.peekhint .ar{display:inline-block;animation:bob .9s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.empty-msg{font-size:10.5px;color:#8fa79b;text-align:center;line-height:1.5}
/* ---------- message strip ---------- */
.msg{
  flex:0 0 auto;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  padding:4px 8px;border-radius:12px;background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.06);
  text-align:center;overflow:hidden;
}
.msg .l1{font-size:12.5px;font-weight:800;letter-spacing:.2px;display:flex;align-items:center;gap:6px;justify-content:center}
.msg .l2{font-size:9.5px;color:#9fb5aa;letter-spacing:.1px}
.msg.win .l1{color:var(--win);font-size:15px}
.msg.lose .l1{color:var(--lose);font-size:15px}
.msg.ppong .l1{color:#ffd166;font-size:15px;animation:shakebig .5s ease}
@keyframes shakebig{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.msg.ai .l1{color:#cfe0d8}
.react{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.react span{font-size:9.5px;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);color:#dfd8c6}
/* ---------- actions ---------- */
.actions{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;min-height:88px;justify-content:center}
.betrow{display:flex;gap:5px}
.chip{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;border-radius:11px;
  border:1px solid rgba(230,195,124,.25);background:rgba(255,255,255,.05);color:#eee5d1;
  font-family:inherit;cursor:pointer;transition:.14s;
}
.chip b{font-size:12.5px;font-weight:900;font-variant-numeric:tabular-nums}
.chip span{font-size:8px;color:#9fb5aa;letter-spacing:.3px}
.chip.on{border-color:var(--gold);background:linear-gradient(180deg,rgba(230,195,124,.3),rgba(230,195,124,.1));box-shadow:0 0 0 1px rgba(230,195,124,.3) inset}
.chip.on b{color:#fff3d4}
.ctarow{display:flex;gap:6px}
.go{
  flex:2;padding:11px 8px;border-radius:12px;border:none;cursor:pointer;
  background:linear-gradient(180deg,#e9c983,#bf9036);color:#2a1b06;font-size:13.5px;font-weight:900;
  letter-spacing:.8px;font-family:inherit;box-shadow:0 5px 14px rgba(0,0,0,.3);
}
.go:active{transform:scale(.985)}
.go.wide{flex:1}
.ghost{
  flex:1;padding:11px 8px;border-radius:12px;border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.05);color:#e8dfc9;font-size:12.5px;font-weight:800;
  letter-spacing:.5px;font-family:inherit;cursor:pointer;
}
.ghost:active{background:rgba(255,255,255,.12)}
.mini{
  align-self:center;padding:7px 14px;border-radius:999px;border:1px solid rgba(230,195,124,.4);
  background:rgba(0,0,0,.25);color:#ffeec4;font-size:11px;font-weight:800;font-family:inherit;cursor:pointer;
}
.thinking{display:flex;align-items:center;justify-content:center;gap:7px;font-size:12px;color:#cfe0d8;padding:12px}
.dots{display:inline-flex;gap:3px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--gold);animation:blink 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
/* ---------- effects ---------- */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
.snotfx{position:absolute;inset:0;pointer-events:none;overflow:visible}
.snotfx .face{position:absolute;left:50%;top:-6px;transform:translateX(-50%);font-size:26px;animation:snotwob .9s ease-in-out infinite}
.snotfx .drop{position:absolute;font-size:13px;animation:drip 1.1s ease-in forwards}
.snotfx .drop:nth-child(2){left:42%;animation-delay:.05s}
.snotfx .drop:nth-child(3){left:56%;animation-delay:.25s}
.snotfx .drop:nth-child(4){left:48%;animation-delay:.45s}
@keyframes drip{0%{top:6px;opacity:0;transform:scale(.5)}20%{opacity:1}100%{top:64%;opacity:0;transform:scale(1.15)}}
@keyframes snotwob{0%,100%{transform:translateX(-50%) rotate(-6deg)}50%{transform:translateX(-50%) rotate(6deg)}}
.potup{position:absolute;left:50%;top:-2px;transform:translateX(-50%);font-size:10px;font-weight:900;color:#ffd166;white-space:nowrap;animation:floatup 1.2s ease-out forwards;pointer-events:none}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,6px) scale(.8)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-18px) scale(1.05)}}
/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:80;backdrop-filter:blur(3px)}
.sheet.on{display:flex}
.sheetbox{
  width:100%;max-width:430px;background:#0c2b22;border-top:1px solid rgba(230,195,124,.3);
  border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:11px;
}
.sheetbox h3{font-size:13px;letter-spacing:2px;color:#ffeec4;font-weight:800}
.sheetbox .row{font-size:12.5px}
.sheetbox .ghost{padding:11px}
@media (max-height:700px){
  .hero-cards{height:62px}
  .hero h1{font-size:21px}
  .hero .sub{font-size:10px}
  .mode{min-height:46px;padding:7px 3px}
  .setupbox{padding:8px 10px;gap:6px}
  .msg{min-height:44px}
  .actions{min-height:80px}
  .thirdwrap{width:min(27.44vw,18.92vh);height:min(42.53vw,29.33vh)}
}
@media (max-height:600px){
  .hero-cards{display:none}
  .thirdwrap{width:min(24.6vw,17.03vh);height:min(38.13vw,26.4vh)}
  .slot{width:min(14.19vw,9.94vh);height:min(22vw,15.4vh)}
}
</style>
</head>
<body>
<div id="app">

/* ============================================================
   월남뽕 · Wolnam-ppong — 순수 로직 + 카드 아트 (DOM 비의존)
   브라우저와 Node/QuickJS 테스트에서 동일하게 동작한다.
   ============================================================ */
var WNB = (function () {
  'use strict';

  var MONTHS = [
    { m: 1,  kr: '송학', en: 'Pine & Crane',       short: 'Pine' },
    { m: 2,  kr: '매조', en: 'Plum Blossom',       short: 'Plum' },
    { m: 3,  kr: '벚꽃', en: 'Cherry Blossom',     short: 'Cherry' },
    { m: 4,  kr: '흑싸리', en: 'Black Bush Clover', short: 'Black Clover' },
    { m: 5,  kr: '난초', en: 'Orchid',             short: 'Orchid' },
    { m: 6,  kr: '모란', en: 'Peony',              short: 'Peony' },
    { m: 7,  kr: '홍싸리', en: 'Red Bush Clover',   short: 'Red Clover' },
    { m: 8,  kr: '공산', en: 'Moon over Mountain',  short: 'Moon' },
    { m: 9,  kr: '국화', en: 'Chrysanthemum',       short: 'Chrysanthemum' },
    { m: 10, kr: '단풍', en: 'Maple',              short: 'Maple' },
    { m: 11, kr: '오동', en: 'Paulownia',          short: 'Paulownia' },
    { m: 12, kr: '비',   en: 'Rain',               short: 'Rain' }
  ];
  var LANE = { 1: '#c0392b', 2: '#c0392b', 3: '#c0392b', 4: '#2f6b46', 5: '#2f6b46', 6: '#2f4f8a',
               7: '#b3231c', 8: '#6b2f2a', 9: '#2f4f8a', 10: '#2f4f8a', 11: '#2f6b46', 12: '#3a4a6b' };

  /* ---------- deck ---------- */
  function newDeck() {
    var d = [];
    for (var m = 1; m <= 12; m++) {
      for (var v = 0; v < 4; v++) d.push({ id: m + '-' + v, month: m, variant: v });
    }
    return d;
  }
  function shuffle(a, rng) {
    rng = rng || Math.random;
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function mulberry32(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* ============================================================
     게임 상태
     ============================================================ */
  function newGame(cfg) {
    cfg = cfg || {};
    var mode = cfg.mode || 'solo';
    var ante = cfg.ante || 10;
    var rng = cfg.rng || Math.random;
    var players = [];
    var i;

    if (mode === 'solo') {
      players.push({ i: 0, name: '나', nameEn: 'You', chips: cfg.chips || 1000, bankrupt: false, ai: false, avatar: '\uD83D\uDE4B', style: 'human' });
    } else if (mode === 'ai') {
      var n = Math.max(2, Math.min(4, cfg.count || 3));
      players.push({ i: 0, name: '나', nameEn: 'You', chips: cfg.chips || 1000, bankrupt: false, ai: false, avatar: '\uD83D\uDE4B', style: 'human' });
      var roster = [
        { name: '타짜 고양이', nameEn: 'Tazza Cat', avatar: '\uD83D\uDC31', style: 'reckless' },
        { name: '신중한 부엉이', nameEn: 'Cautious Owl', avatar: '\uD83E\uDD89', style: 'cautious' },
        { name: '불도저 호랑이', nameEn: 'Bulldozer Tiger', avatar: '\uD83D\uDC2F', style: 'aggressive' }
      ];
      for (i = 1; i < n; i++) {
        var r = roster[i - 1];
        players.push({ i: i, name: r.name, nameEn: r.nameEn, chips: cfg.chips || 1000, bankrupt: false, ai: true, avatar: r.avatar, style: r.style });
      }
    } else {
      var c = Math.max(2, Math.min(6, cfg.count || 3));
      var names = cfg.names || [];
      for (i = 0; i < c; i++) {
        players.push({
          i: i, name: (names[i] && String(names[i]).trim()) || ('P' + (i + 1)),
          nameEn: (names[i] && String(names[i]).trim()) || ('P' + (i + 1)),
          chips: cfg.chips || 1000, bankrupt: false, ai: false, avatar: '\uD83D\uDC64', style: 'human'
        });
      }
    }

    var s = {
      mode: mode,
      ante: ante,
      ppongDouble: !!cfg.ppongDouble,
      players: players,
      turn: 0,
      pot: 0,
      deck: shuffle(newDeck(), rng),
      rng: rng,
      board: [],
      third: null,
      bet: 0,
      betKind: 'normal',
      pair: false,
      noGap: false,
      phase: 'idle',
      result: null,
      over: false,
      hand: 0,
      reshuffles: 0,
      log: []
    };
    beginTurn(s);
    return s;
  }

  function meta(m) { return MONTHS[m - 1]; }
  function player(s) { return s.players[s.turn]; }
  function isAiTurn(s) { return !!(s && s.players[s.turn] && s.players[s.turn].ai); }

  function refillDeck(s) {
    var used = {};
    s.board.forEach(function (c) { used[c.id] = 1; });
    if (s.third) used[s.third.id] = 1;
    var d = newDeck().filter(function (c) { return !used[c.id]; });
    s.deck = shuffle(d, s.rng);
    s.reshuffles++;
    s.log.push({ t: 'reshuffle', hand: s.hand, size: s.deck.length });
  }
  function draw(s) {
    if (s.deck.length < 1) refillDeck(s);
    return s.deck.pop();
  }
  function advance(s) {
    var n = s.players.length, i = s.turn;
    for (var k = 0; k < n; k++) {
      i = (i + 1) % n;
      if (!s.players[i].bankrupt) { s.turn = i; return true; }
    }
    return false;
  }
  function activeCount(s) {
    return s.players.filter(function (p) { return !p.bankrupt; }).length;
  }

  function beginTurn(s) {
    if (s.over) return;
    var guard = 0;
    while (guard++ < 40) {
      var p = s.players[s.turn];
      if (p.bankrupt) { if (!advance(s)) { s.over = true; return; } continue; }
      if (p.chips < s.ante) {
        p.bankrupt = true;
        s.log.push({ t: 'broke', i: p.i });
        if (s.mode !== 'solo' && activeCount(s) <= 1) { s.over = true; return; }
        if (!advance(s)) { s.over = true; return; }
        continue;
      }
      p.chips -= s.ante;
      s.pot += s.ante;
      if (p.chips < 1) {              /* 앤티로 전 재산을 낸 플레이어는 더 걸 수 없다 → 파산 처리 */
        p.bankrupt = true;
        s.log.push({ t: 'broke', i: p.i });
        if (s.mode !== 'solo' && activeCount(s) <= 1) { s.over = true; return; }
        if (!advance(s)) { s.over = true; return; }
        continue;
      }
      s.hand++;
      if (s.deck.length < 2) refillDeck(s);
      var c1 = draw(s), c2 = draw(s);
      s.board = [c1, c2].sort(function (x, y) {
        return x.month === y.month ? x.variant - y.variant : x.month - y.month;
      });
      s.third = null;
      s.bet = 0;
      s.betKind = 'normal';
      s.result = null;
      s.pair = s.board[0].month === s.board[1].month;
      s.noGap = (s.board[1].month - s.board[0].month) <= 1;
      s.phase = 'bet';
      return;
    }
    s.over = true;
  }

  function betLimits(s) {
    var p = player(s);
    var max = Math.min(s.pot, p.chips);
    var min = Math.min(s.ante, max);
    if (min < 1) min = 1;
    return { min: min, max: max };
  }

  function odds(s) {
    if (!s.board.length) return { win: 0, total: 0, pct: 0 };
    var a = s.board[0].month, b = s.board[1].month, win = 0;
    for (var i = 0; i < s.deck.length; i++) {
      var m = s.deck[i].month;

  function placeBet(s, amount) {
    if (s.phase !== 'bet') return { ok: false, err: 'phase' };
    var L = betLimits(s);
    if (L.max < 1) return { ok: false, err: 'nochips' };
    var amt = Math.floor(Number(amount));
    if (!isFinite(amt)) amt = L.min;
    amt = Math.max(L.min, Math.min(L.max, amt));

    s.betKind = 'normal';
    s.third = draw(s);
    s.phase = 'peek';
    return { ok: true, amount: amt };

    s.bet = amt;
    s.betKind = 'nogap';
    s.third = draw(s);
    s.phase = 'peek';

    var bet = s.bet, type, delta, gain, penalty, mult = 1, short = false;

        type = 'ppongWin'; delta = gain;
      } else {

        p.chips -= penalty; s.pot += penalty;
        type = 'lose'; delta = -penalty;
        short = penalty < bet;

    } else if (m > a && m < b) {

      type = 'win'; delta = gain;
    } else if (m === a || m === b) {

  function fold(s) {

    s.result = { type: 'fold', delta: 0, bet: 0, a: s.board[0].month, b: s.board[1].month, m: null, turn: s.turn, potUp: 0 };
    s.phase = 'result';

    if (s.mode === 'solo' && player(s).bankrupt) { s.over = true; return { ok: true, over: true }; }

  /* ---------- AI ---------- */
  function aiDecide(s) {

    if (amt > L.max) amt = L.max;
    return { action: 'bet', amount: amt, pct: pct };
  }

  function paulownia(x, y, s, rot) {

  /* 12월 비 — 굵은 빗줄기 + 갓 쓴 인물(광) + 제비(열끗) + 격자(쌍피) */

  function rain() {
    var o = '', i, x;
    for (i = 0; i < 9; i++) {

  function lattice(x, y, s) {
    var o = '<g transform="translate(' + x + ' ' + y + ') scale(' + s + ')">', i, j, p, q, dx, dy;
    o += fp('M-38 8 C-36 -22 -19 -36 0 -36 C19 -36 36 -22 38 8 Z', PAL.paper2, PAL.ink, 2.8);
    /* 격자 — 반원 안쪽에만 다이아몬드를 찍는다 */
    for (i = 8; i <= 32; i += 6) {
      for (j = -172; j <= -8; j += 11) {
        p = polar(0, 8, i, j);
        dx = p[0]; dy = p[1] - 8;
        if (p[1] > 4) continue;
        if (dx * dx + dy * dy > 33 * 33) continue;
        o += '<path d="M' + dx + ' ' + (p[1] - 3) + ' L' + (dx + 3) + ' ' + p[1] + ' L' + dx + ' ' + (p[1] + 3) +
          ' L' + (dx - 3) + ' ' + p[1] + ' Z" fill="' + PAL.blu + '" fill-opacity="0.8"/>';
      }
    }
    o += st('M-38 8 L38 8', 4, PAL.red, 0.95);
    o += '<path d="M-38 8 C-36 -22 -19 -36 0 -36 C19 -36 36 -22 38 8" stroke="' + PAL.red + '" stroke-width="3.4" fill="none" stroke-linecap="round"/>';
    o += st('M0 -38 L0 30', 3.4, PAL.brn);

    o += '<circle cx="0" cy="-39" r="3" fill="' + PAL.gold + '"/>';
    return o + '</g>';
  }

  /* ------------------------------------------------------------ */
  /* 좌측 상단 숫자 배지 — 금박(Gold Foil) 원형 1개                */
  /*   · 모든 색을 Hex로 고정 (CSS 변수/테마/브라우저 보정 영향 없음)  */
  /*   · 안쪽 채움은 SVG <radialGradient> + 대각선 광택 <linearGradient> */
  var BG = {
    cx: 20, cy: 20.5, r: 13.0,
    edge: '#7a5408',   /* 바깥 테두리 — 진한 금동색 */

  /* 금박 그라데이션 defs — 카드마다 같은 정의를 넣어(사본 간 id 충돌 없이) 항상 로컬 참조 */

      '<linearGradient id="' + sid + '" x1="0" y1="1" x2="1" y2="0">' +
        '<stop offset="0" stop-color="#fffdf0" stop-opacity="0"/>' +
        '<stop offset="0.22" stop-color="#fffdf0" stop-opacity="0.06"/>' +
        '<stop offset="0.28" stop-color="#fffdf0" stop-opacity="0.36"/>' +

        '<stop offset="0.50" stop-color="#fff8d2" stop-opacity="0.30"/>' +
        '<stop offset="0.53" stop-color="#fff8d2" stop-opacity="0.40"/>' +
        '<stop offset="0.57" stop-color="#fff8d2" stop-opacity="0.08"/>' +
        '<stop offset="0.62" stop-color="#fff8d2" stop-opacity="0"/>' +
        '<stop offset="0.77" stop-color="#fffdf0" stop-opacity="0.16"/>' +
        '<stop offset="0.80" stop-color="#fffdf0" stop-opacity="0.28"/>' +

        '<stop offset="0.90" stop-color="#fffdf0" stop-opacity="0"/>' +
      '</linearGradient>';

  /* 금박 원 + 정중앙 먹색 숫자. gid/sid 없이 호출해도 동작하도록 기본 id 사용 */
  function numBadge(m, gid, sid) {
    gid = gid || 'gfBadge';
    sid = sid || 'gsBadge';
    var cx = BG.cx, cy = BG.cy, r = BG.r;
    var fs = m > 9 ? 12.0 : 15.6;   /* 두 자리(10~12)도 원 안에 여유 있게 */
    return '<g>' +
      /* 살짝 떠 보이는 미세 그림자 */
      '<circle cx="' + cx + '" cy="' + (cy + 0.85) + '" r="' + r + '" fill="' + BG.shadow + '" fill-opacity="0.26"/>' +
      /* 금박 채움 */
      '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="url(#' + gid + ')"/>' +

            }
          }
        } catch (e2) {}
        s.speak(u);
      } catch (e3) {}
    }
    return {
      pass: function () { say('pass'); },
      call: function () { say('call'); },
      allin: function () { say('allin'); },
      action: function (k) { say(k); },

  var fx = { c: null, ctx: null, parts: [], raf: 0, w: 0, h: 0 };
  function fxInit() {
    fx.c = $('#fx');
    fx.ctx = fx.c.getContext('2d');
    fxResize();
    window.addEventListener('resize', fxResize);
  }
  function fxResize() {
    if (!fx.c) return;
    var d = window.devicePixelRatio || 1;
    fx.w = fx.c.clientWidth; fx.h = fx.c.clientHeight;
    fx.c.width = Math.round(fx.w * d); fx.c.height = Math.round(fx.h * d);
    fx.ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  function confetti() {
    if (!fx.ctx) return;
    if (!fx.w) fxResize();
    var colors = ['#e6c37c', '#b3231c', '#f6eeda', '#2f8f63', '#ffd166', '#ff8fa3'];
    var cx = fx.w / 2, cy = fx.h * 0.42;
    for (var i = 0; i < 130; i++) {
      var a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 7;
      fx.parts.push({
        x: cx + (Math.random() - 0.5) * 40, y: cy + (Math.random() - 0.5) * 30,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 3.5,
        w: 3 + Math.random() * 5, h: 5 + Math.random() * 9,
        rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.5,
        c: colors[(Math.random() * colors.length) | 0], life: 1
      });
    }
    if (!fx.raf) fx.raf = requestAnimationFrame(fxStep);
  }
  function fxStep() {
    var ctx = fx.ctx;
    ctx.clearRect(0, 0, fx.w, fx.h);
    for (var i = fx.parts.length - 1; i >= 0; i--) {
      var p = fx.parts[i];
      p.vy += 0.14; p.vx *= 0.995; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= 0.006;
      if (p.life <= 0 || p.y > fx.h + 30) { fx.parts.splice(i, 1); continue; }
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    if (fx.parts.length) fx.raf = requestAnimationFrame(fxStep);
    else { fx.raf = 0; ctx.clearRect(0, 0, fx.w, fx.h); }
  }

  function aiStep() {
    if (!S || S.over || S.phase !== 'bet' || !W.isAiTurn(S)) return;
    var d = W.aiDecide(S);
    if (d.action === 'fold') {
      VOICE.pass();
      W.fold(S);
      afterFold();
      return;
    }
    var lim = W.betLimits(S);
    VOICE.action(d.amount >= lim.max ? 'allin' : 'call');
    var r = W.placeBet(S, d.amount);
    if (!r.ok) { W.fold(S); afterFold(); return; }
    showThird(false);
    renderStatus();
    renderMsg('ai', S.players[S.turn].avatar + ' ' + pName(S.players[S.turn]) + ' — ' + t('peeking') + '…', t('bet') + ' ' + fmt(S.bet));

    if (W.isAiTurn(S)) aiTimer = setTimeout(nextTurn, 950);

    clearTimeout(aiTimer);

    paintTurn();

  function applyPeek(p) {
    var cover = $('#thirdCover'), wrap = $('#thirdWrap');
    var w = (p * 100).toFixed(1);
    /* 앞면 위에서 모서리를 벗틴다: 덮개는 그대로 있고, 왼쪽 위 삼각형만 열린다 */
    cover.style.clipPath = 'polygon(' + w + '% 0%, 100% 0%, 100% 100%, 0% 100%, 0% ' + w + '%)';
    cover.style.transform = 'translate(' + (p * 2).toFixed(1) + 'px,' + (-p * 9).toFixed(1) + 'px) rotate(' + (-p * 2.2).toFixed(2) + 'deg)';
    wrap.style.transform = 'scale(' + (1 + p * 0.02).toFixed(3) + ')';
    wrap.classList.toggle('peeked', p > 0.05);
  }

  function peekDown(e) {
    if (!canPeek()) return;
    pk.on = true; pk.sx = e.clientX; pk.sy = e.clientY; pk.armed = false;
    pk.h = $('#thirdWrap').getBoundingClientRect().height || 160;
    SFX.dragStart();
    $('#thirdCover').style.transition = 'none';
    $('#thirdWrap').style.transition = 'none';
    try { $('#thirdWrap').setPointerCapture(e.pointerId); } catch (err) {}
    if (e.cancelable) e.preventDefault();
  }
  function peekMove(e) {
    if (!pk.on) return;
    var dx = e.clientX - pk.sx, dy = e.clientY - pk.sy;
    var dist = Math.max(0, -dy) + Math.abs(dx) * 0.55;
    var p = clamp(dist / (pk.h * 0.52), 0, 1);
    pk.p = p;
    applyPeek(p);
    SFX.dragMove(p);
    ON.sendPeek(p);
    if (p >= 0.58 && !pk.armed) { pk.armed = true; vibrate(12); SFX.tick(); }
    if (e.cancelable) e.preventDefault();
  }
  function peekUp() {
    if (!pk.on) return;
    pk.on = false;
    SFX.dragStop(0.035);
    var cover = $('#thirdCover'), wrap = $('#thirdWrap');
    cover.style.transition = 'clip-path .3s ease, transform .3s ease, opacity .3s';
    wrap.style.transition = 'transform .22s ease';
    if (pk.p >= 0.58) { doReveal(false); return; }
    ON.sendPeek(0);
    cover.style.clipPath = 'polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%, 0% 0%)';
    cover.style.transform = '';
    wrap.style.transform = '';
    wrap.classList.remove('peeked');
    pk.p = 0;
  }

  /* ------------------------------------------------------------
     공개 & 정산 연출
     ------------------------------------------------------------ */
  function doReveal(isAi) {
    if (!S || S.phase !== 'peek' || revealed || busy) return;
    if (ON.isOn()) { ON.requestReveal(); return; }
    busy = true;
    revealed = true;
    var cover = $('#thirdCover'), wrap = $('#thirdWrap');
    cover.style.clipPath = '';
    cover.style.transform = '';
    cover.style.transition = '';
    cover.classList.add('off');
    wrap.classList.remove('shake');
    wrap.classList.add('pop');
    SFX.snap(isAi ? 0.72 : 1);
    $('#peekHint').style.display = 'none';
    var res = W.reveal(S);
    if (!res) { busy = false; return; }

    var win = (res.type === 'win' || res.type === 'ppongWin');
    if (win) { confetti(); vibrate([30, 40, 70]); }
    else if (res.type === 'lose' || res.type === 'ppong' || res.type === 'ppongLose') { vibrate([20, 60, 20]); }

    renderStatus();
    renderPlayers();
    renderActions();

    setTimeout(function () {
      if (win) SFX.win(); else SFX.lose();
      var p = S.players[res.turn];
      var nm = (p.avatar || '') + ' ' + pName(p);
      var react = '';
      var nxt = S.players[(res.turn + 1) % S.players.length];
      if (win) {
        if (ui.mode !== 'solo') {
          var others = S.players.filter(function (x, i) { return i !== res.turn; })
            .map(function (x) { return x.avatar + ' ' + pName(x) + ' 🤧'; }).join('  ');
          react = '<div class="react"><span>' + t('others') + ': ' + others + ' — ' + t('scooped') + '</span></div>';
        }
        renderMsg('win', '🎉 ' + t('win') + ' +' + fmt(res.delta),
          nm + ' · ' + monthLabel(res.m) + ' — ' + (res.type === 'ppongWin' ? t('ppongWin') : t('winSub')) + react);
      } else if (res.type === 'ppong' || res.type === 'ppongLose') {
        if (ui.mode !== 'solo') react = '<div class="react"><span>🔥 ' + t('potUp') + ' · ' + (nxt.avatar || '') + ' ' + pName(nxt) + '</span></div>';
        renderMsg('ppong', '🤧 ' + t('ppong') + ' −' + fmt(-res.delta),
          nm + ' · ' + monthLabel(res.m) + ' — ' + t('ppongSub') + ' · ' + t('pot') + ' ' + fmt(S.pot) + react);
        snot($('#thirdWrap'));
        potUp();
      } else {
        if (ui.mode !== 'solo') react = '<div class="react"><span>🔥 ' + t('potUp') + ' · ' + (nxt.avatar || '') + ' ' + pName(nxt) + '</span></div>';
        renderMsg('lose', '🤧 ' + t('lose') + ' −' + fmt(-res.delta),
          nm + ' · ' + monthLabel(res.m) + ' — ' + t('loseSub') + ' · ' + t('pot') + ' ' + fmt(S.pot) + react);
        snot($('#thirdWrap'));
        potUp();
      }
      renderStatus();
      renderPlayers();
      renderActions();
      busy = false;
      if (isAi || W.isAiTurn(S)) aiTimer = setTimeout(nextTurn, 1900);
    }, 420);
  }

  /* ------------------------------------------------------------
     초기화
     ------------------------------------------------------------ */
  function startGame() {
    if (ui.mode === 'online') { if (ON.isOn()) show('lobby'); return; }
    S = W.newGame({
      mode: ui.mode,
      ante: ui.ante,
      ppongDouble: ui.ppong,
      count: ui.mode === 'ai' ? ui.aiCount : ui.count,
      names: ui.names,
      rng: Math.random
    });
    show('game');
    paintTurn();
  }

  /* ============================================================
     🌐 온라인 방 — Supabase Realtime Broadcast(공개 채널) 위의
        방장 권한(Host-Authoritative) 프로토콜

        · 4자리 방 코드 = 채널 이름(wnb-4829), 초대 링크 = ?room=4829
        · 방장(Host)만 덱 셔플·카드 배분·턴·판돈을 계산하고 상태 스냅샷을 방송한다.
        · 각 참여자의 베팅/쪼기 진행도(peekProgress)는 참여자가 직접 방송해
          다른 화면에서도 같은 애니메이션(쪼기·띡!!·축포·콧물)이 실시간으로 보인다.
        · 키는 /api/wolnambbong/config 가 서버 환경변수에서 공개용(anon) 키만 내려준다.
     ============================================================ */
  var ON = (function () {
    var st = {
      on: false, cfg: null, role: '', code: '', rid: '', rev: 0, cid: '', nick: '',
      hostCid: '', roster: [], started: false, snap: null, third: null,
      lastRev: 0, lastDoneRev: 0, stageKey: '', ws: null, ref: 0, joinRef: null,
      joined: false, closed: true, retry: 0, hbTimer: 0, tickTimer: 0,
      hostSeen: 0, seen: {}, joinTimer: null, remoteDrag: false,
      pending: '', lastPeekSent: 0, reconnectAt: 0
    };
    var AV = ['\uD83D\uDE4B', '\uD83D\uDE3A', '\uD83E\uDD89', '\uD83D\uDC2F', '\uD83D\uDC30', '\uD83D\uDC3C'];

    function $(id) { return document.getElementById(id); }
    function isHost() { return st.role === 'host'; }
    function rand4() { return 1000 + Math.floor(Math.random() * 9000); }
    function ridc() {
      var s = '';
      for (var i = 0; i < 8; i++) s += '0123456789abcdef'[(Math.random() * 16) | 0];
      return s;
    }
    function normNick(v) { return String(v == null ? '' : v).replace(/\s+/g, ' ').trim().slice(0, 8); }
    function nickKey(v) { return normNick(v).toLowerCase(); }
    function cidOf(i) { return (st.snap && st.snap.players[i]) ? st.snap.players[i].cid : ''; }
    function myIdx() {
      if (!st.snap) return -1;
      for (var i = 0; i < st.snap.players.length; i++) if (st.snap.players[i].cid === st.cid) return i;
      return -1;
    }

    /* ---------------- 상태 문구 ---------------- */
    function setConn(txt) {
      var b = $('connBar');
      if (!b) return;
      if (!txt) { b.style.display = 'none'; b.textContent = ''; return; }
      b.style.display = 'block';
      b.textContent = txt;
    }
    function hint(txt, bad) {
      var h = $('onlineHint');
      if (!h) return;
      h.textContent = txt || '';
      h.style.color = bad ? '#ff9489' : '#8fa79b';
    }

    /* ---------------- 전송 계층(Phoenix v1.0.0 · WebSocket) ----------------
       Supabase Realtime 은 Phoenix 채널 프로토콜을 쓴다.
       vsn=1.0.0 은 맵 형식({topic,event,payload,ref})을 쓰고, 응답은 배열/맵 둘 다 올 수 있어
       수신부는 두 형식을 모두 처리한다. 외부 라이브러리(supabase-js) 없이 표준 WebSocket 만 사용. */
    function sendRaw(obj) {
      if (!st.ws || st.ws.readyState !== 1) return false;
      try { st.ws.send(JSON.stringify(obj)); return true; } catch (e) { return false; }
    }
    function topic() { return 'realtime:wnb-' + st.code; }
    function broadcast(event, payload) {
      if (!st.joined) return false;
      return sendRaw({
        topic: topic(),
        event: 'broadcast',
        payload: { type: 'broadcast', event: event, payload: payload },
        ref: String(++st.ref)
      });
    }
    function joinChannel() {
      var jr = String(++st.ref);
      st.joinRef = jr;
      sendRaw({
        topic: topic(),
        event: 'phx_join',
        payload: {
          config: {
            broadcast: { ack: false, self: true },
            presence: { key: st.cid },
            postgres_changes: [],
            private: false
          },
          access_token: st.cfg.key
        },
        ref: jr
      });
      clearInterval(st.hbTimer);
      st.hbTimer = setInterval(function () {
        sendRaw({ topic: 'phoenix', event: 'heartbeat', payload: {}, ref: String(++st.ref) });
      }, 25000);
    }
    function connect() {
      if (!st.cfg || !st.code) return;
      if (st.ws && (st.ws.readyState === 0 || st.ws.readyState === 1)) return;
      var base = String(st.cfg.url || '').replace(/\/+$/, '').replace(/^http/, 'ws');
      var url = base + '/realtime/v1/websocket?apikey=' + encodeURIComponent(st.cfg.key) + '&vsn=1.0.0';
      var ws;
      try { ws = new WebSocket(url); } catch (e) { setConn('온라인 연결을 열 수 없습니다'); return; }
      st.ws = ws;
      st.joined = false;
      setConn('연결 중…');
      ws.onopen = function () { joinChannel(); };
      ws.onmessage = function (ev) { onWire(ev.data); };
      ws.onerror = function () {};
      ws.onclose = function () {
        st.joined = false;
        clearInterval(st.hbTimer);
        st.ws = null;
        if (st.closed) return;
        setConn('연결이 끊겼습니다 — 다시 연결 중…');
        var wait = Math.min(600 * Math.pow(2, st.retry++), 5000);
        clearTimeout(st.reconnectAt);
        st.reconnectAt = setTimeout(connect, wait);
      };
    }
    function onWire(raw) {
      var m;
      try { m = JSON.parse(raw); } catch (e) { return; }
      var event = m.event, payload = m.payload;
      if (Object.prototype.toString.call(m) === '[object Array]') { event = m[3]; payload = m[4]; }
      if (event === 'phx_reply') {
        var status = payload && payload.status;
        if (status === 'ok') {
          st.joined = true; st.retry = 0; setConn('');
          onJoined();
        } else if (!isHost()) {
          hint('방에 접속하지 못했습니다. 잠시 후 다시 시도해 주세요.', true);
        }
        return;
      }
      if (event === 'phx_error' || event === 'phx_close') {
        st.joined = false;
        if (!st.closed) setConn('연결이 끊겼습니다 — 다시 연결 중…');
        return;
      }
      if (event === 'broadcast') {
        var p = payload && payload.payload;
        if (!p) return;
        onMsg(payload.event, p);
      }
    }
    function onJoined() {
      if (isHost()) {
        broadcast('open', { rid: st.rid, code: st.code, hostCid: st.cid, ts: Date.now() });
        broadcast('roster', { rid: st.rid, list: rosterPub() });
        if (st.started && S) broadcast('state', { rid: st.rid, snap: snapOf() });
      } else {
        sayHello();
      }
    }
    function sayHello() {
      broadcast('hello', { rid: st.rid, cid: st.cid, nick: st.nick, ts: Date.now() });
    }

    /* ---------------- 방장: 로스터/입장 ---------------- */
    function rosterPub() {
      return st.roster.map(function (r) { return { cid: r.cid, nick: r.nick, av: r.av }; });
    }
    function hostHello(d) {
      if (!isHost() || !d || !d.cid) return;
      if (d.rid && d.rid !== st.rid) return;              /* 같은 코드의 다른 방 */
      var nick = normNick(d.nick), i, who = null;
      for (i = 0; i < st.roster.length; i++) if (st.roster[i].cid === d.cid) who = st.roster[i];
      if (who) { who.seen = Date.now(); hostWelcome(d.cid); return; }   /* 재접속 */
      if (st.started) return deny(d.cid, 'started');
      if (!nick) return deny(d.cid, 'nick');
      if (st.roster.length >= 6) return deny(d.cid, 'full');
      for (i = 0; i < st.roster.length; i++) if (nickKey(st.roster[i].nick) === nickKey(nick)) return deny(d.cid, 'dup');
      st.roster.push({ cid: d.cid, nick: nick, av: AV[st.roster.length % AV.length], seen: Date.now() });
      broadcast('roster', { rid: st.rid, list: rosterPub() });
      hostWelcome(d.cid);
      renderLobby();
    }
    function hostWelcome(cid) {
      broadcast('welcome', {
        to: cid, rid: st.rid, code: st.code, hostCid: st.cid, started: st.started,
        list: rosterPub(), ante: ui.ante, ppong: ui.ppong,
        snap: (st.started && S) ? snapOf() : null,
        third: (st.started && S && S.phase === 'peek' && cidOf(S.turn) === cid && st.third) ? st.third : null
      });
    }
    function deny(cid, reason) { broadcast('denied', { to: cid, rid: st.rid, reason: reason }); }
    function hostBye(d) {
      if (!isHost() || !d || (d.rid && d.rid !== st.rid)) return;
      for (var i = 0; i < st.roster.length; i++) {
        if (st.roster[i].cid === d.cid) { st.roster.splice(i, 1); break; }
      }
      broadcast('roster', { rid: st.rid, list: rosterPub() });
      renderLobby();
    }

    /* ---------------- 스냅샷 ---------------- */
    function snapOf() {
      var s = S;
      return {
        rid: st.rid, rev: ++st.rev,
        phase: s.over ? 'over' : s.phase,
        turn: s.turn, pot: s.pot, deck: s.deck.length, ante: s.ante,
        ppong: !!s.ppongDouble, hand: s.hand, pair: !!s.pair, noGap: !!s.noGap,
        bet: s.bet, betKind: s.betKind,
        board: s.board.map(function (c) { return { month: c.month, variant: c.variant }; }),
        third: (s.phase === 'result' && s.third) ? { month: s.third.month, variant: s.third.variant } : null,
        oddsPct: s.phase === 'bet' ? W.odds(s).pct : 0,
        players: s.players.map(function (p, i) {
          var r = st.roster[i];
          return { cid: r ? r.cid : '', name: p.name, av: p.avatar || '\uD83D\uDE4B', chips: p.chips, bankrupt: !!p.bankrupt };
        }),
        result: s.phase === 'result' ? s.result : null,
        over: !!s.over
      };
    }

    /* ---------------- 로컬 상태 재구성(모든 클라이언트 공통) ---------------- */
    function makeLocal(sn) {
      var players = sn.players.map(function (p, i) {
        return {
          i: i, name: p.name, nameEn: p.name, chips: p.chips, bankrupt: !!p.bankrupt,
          ai: false, avatar: p.av || '\uD83D\uDE4B', style: 'human', cid: p.cid
        };
      });
      var deck = [], k;
      for (k = 0; k < (sn.deck || 0); k++) deck.push({ id: 'h' + k, month: 0, variant: 0 });
      return {
        mode: 'pass', ante: sn.ante, ppongDouble: !!sn.ppong, players: players,
        turn: sn.turn, pot: sn.pot, deck: deck, rng: Math.random,
        board: sn.board.map(function (c) { return { id: c.month + '-' + c.variant, month: c.month, variant: c.variant }; }),
        third: sn.third ? { id: sn.third.month + '-' + sn.third.variant, month: sn.third.month, variant: sn.third.variant } : null,
        bet: sn.bet, betKind: sn.betKind || 'normal', pair: !!sn.pair, noGap: !!sn.noGap,
        phase: sn.phase, result: sn.result || null, over: !!sn.over,
        hand: sn.hand || 0, reshuffles: 0, log: []
      };
    }

    function applySnap(sn) {
      if (!sn) return;
      if (sn.rid && st.rid && sn.rid !== st.rid) return;
      if (typeof sn.rev === 'number' && sn.rev <= st.lastRev) return;
      st.lastRev = sn.rev;
      st.snap = sn;
      if (sn.phase === 'bet') st.third = null;
      S = makeLocal(sn);
      busy = false;
      revealed = (sn.phase === 'result');
      show('game');
      var badge = $('roomBadge');
      if (badge) { badge.style.display = 'inline-flex'; badge.innerHTML = '🌐 <b>' + st.code + '</b>'; }
      renderStatus();
      renderPlayers();
      renderBoard();
      onlineStage(sn);
      renderActions();
      onlineMsg(sn);
    }

    /* ---------------- 화면: 3번째 패(쪼기) ---------------- */
    function onlineStage(sn) {
      var key = sn.rev + '|' + sn.phase + '|' + sn.turn;
      if (st.stageKey === key) return;
      st.stageKey = key;
      var cover = $('#thirdCover'), wrap = $('#thirdWrap');
      var me = myIdx();
      if (sn.phase === 'bet' || sn.phase === 'over') { resetThird(); return; }
      if (sn.phase === 'peek') {
        cover.className = 'cover';
        cover.style.clipPath = ''; cover.style.transform = ''; cover.style.opacity = ''; cover.style.transition = '';
        cover.innerHTML = W.backSVG();
        var face = (sn.turn === me && st.third) ? st.third : null;
        $('#thirdFace').innerHTML = face ? W.faceSVG(face) : '';
        wrap.classList.remove('pop', 'shake');
        wrap.style.transform = '';
        $('#peekHint').style.display = (sn.turn === me) ? 'flex' : 'none';
        return;
      }
      if (sn.phase === 'result') {
        $('#thirdFace').innerHTML = sn.third ? W.faceSVG(sn.third) : '';
        cover.innerHTML = '';
        cover.classList.add('off');
        $('#peekHint').style.display = 'none';
      }
    }

    /* ---------------- 화면: 문구/액션 ---------------- */
    function onlineMsg(sn) {
      var me = myIdx(), p = sn.players[sn.turn] || sn.players[0];
      if (sn.over) {
        var alive = sn.players.filter(function (x) { return !x.bankrupt; });
        var w = alive[0];
        if (w) renderMsg('win', '🏆 ' + t('winner') + ': ' + (w.av || '') + ' ' + w.name, fmt(w.chips) + ' ' + t('chipsLeft'));
        else renderMsg('lose', t('over'), t('gameOverSub'));
        return;
      }
      if (sn.phase === 'bet') {
        if (sn.turn === me) {
          var L = W.betLimits(S);
          renderMsg('', '👆 ' + (ui.lang === 'en' ? 'Your turn — call or pass' : '내 차례 — 걸기 / 패스'),
            t('ante') + ' ' + sn.ante + ' · ' + t('max') + ' ' + fmt(L.max));
        } else {
          renderMsg('ai', (p.av || '') + ' ' + p.name + ' · ' + t('turn'), t('thinking') + '…');
        }
        return;
      }
      if (sn.phase === 'peek') {
        if (sn.turn === me) renderMsg('', '👆 ' + t('myPeek'), t('peekHint'));
        else renderMsg('ai', (p.av || '') + ' ' + p.name + ' — ' + t('peeking') + '…', t('bet') + ' ' + fmt(sn.bet));
      }
    }

    function onlineActions(A) {
      var sn = st.snap;
      if (!sn) { A.innerHTML = ''; return; }
      var me = myIdx();
      if (sn.over) {
        A.innerHTML = '<button class="go wide" id="againBtn">' + (isHost() ? t('restartBtn') : t('leave')) + '</button>';
        var ab = $('againBtn');
        if (ab) ab.onclick = function () { if (isHost()) hostRestart(); else leave(true); };
        return;
      }
      if (sn.phase === 'bet') {
        if (sn.turn === me) { A.innerHTML = buildBetUI(); bindOnlineBet(); }
        else {
          var p = sn.players[sn.turn];
          A.innerHTML = '<div class="thinking">' + (p.av || '') + ' ' + p.name +
            ' <span class="dots"><i></i><i></i><i></i></span> ' + t('thinking') + '</div>';
        }
        return;
      }
      if (sn.phase === 'peek') {
        if (sn.turn === me) {
          A.innerHTML = '<button class="mini" id="quickBtn">⚡ ' + t('quick') + '</button>';
          var qb = $('quickBtn');
          if (qb) qb.onclick = function () { doReveal(false); };
        } else {
          var p2 = sn.players[sn.turn];
          A.innerHTML = '<div class="thinking">' + (p2.av || '') + ' ' + p2.name +
            ' <span class="dots"><i></i><i></i><i></i></span> ' + t('peeking') + '</div>';
        }
        return;
      }
      if (sn.phase === 'result') {
        if (isHost()) {
          A.innerHTML = '<button class="go wide" id="nextBtn">' + t('next') + ' →</button>';
          var nb = $('nextBtn');
          if (nb) nb.onclick = function () { hostNext(); };
        } else {
          A.innerHTML = '<div class="thinking">' + (ui.lang === 'en' ? 'Waiting for the host…' : '방장이 다음 판을 준비 중…') + '</div>';
        }
      }
    }

    function bindOnlineBet() {
      var chips = document.querySelectorAll('#actions .chip[data-amt]');
      for (var i = 0; i < chips.length; i++) {
        chips[i].onclick = function () { ui.sel = +this.getAttribute('data-amt'); renderActions(); };
      }
      var L = W.betLimits(S);
      var pb = $('passBtn');
      if (pb) pb.onclick = function () { if (busy) return; VOICE.pass(); act('pass', 0); };
      var bb = $('betBtn');
      if (bb) bb.onclick = function () {
        if (busy) return;
        VOICE.action(ui.sel >= L.max ? 'allin' : 'call');
        act('bet', ui.sel);
      };
      var nb = $('ngBtn');
      if (nb) nb.onclick = function () { if (busy) return; VOICE.call(); act('nogap', 0); };
    }

    /* ---------------- 베팅/쪼기/공개 ---------------- */
    function act(kind, amount) {
      if (!st.snap || st.snap.phase !== 'bet' || st.snap.turn !== myIdx() || busy) return;
      busy = true;
      var m = { rid: st.rid, cid: st.cid, kind: kind, amount: amount || 0, rev: st.snap.rev };
      renderMsg('', '⏳ ' + (ui.lang === 'en' ? 'Sent…' : '전송 중…'), '');
      if (isHost()) hostAct(m); else broadcast('act', m);
      setTimeout(function () { busy = false; }, 2500);
    }
    function hostAct(m) {
      if (!S || S.phase !== 'bet' || cidOf(S.turn) !== m.cid) return;
      var r;
      if (m.kind === 'pass') r = W.fold(S);
      else if (m.kind === 'nogap') r = W.placeNoGapBet(S);
      else r = W.placeBet(S, m.amount);
      if (!r || !r.ok) return;
      st.third = S.third ? { month: S.third.month, variant: S.third.variant } : null;
      pushState(m.cid);
    }
    function pushState(actorCid) {
      var sn = snapOf();
      broadcast('state', { rid: st.rid, snap: sn });
      if (actorCid && st.third && sn.phase === 'peek') {
        broadcast('third', { rid: st.rid, to: actorCid, card: st.third, rev: sn.rev });
      }
      applySnap(sn);
    }
    function sendPeek(p) {
      if (!st.snap || st.snap.phase !== 'peek' || st.snap.turn !== myIdx()) return;
      var now = Date.now(), end = p <= 0;
      if (!end && now - st.lastPeekSent < 45) return;
      st.lastPeekSent = now;
      broadcast('peek', { rid: st.rid, cid: st.cid, p: end ? 0 : Math.round(p * 100) / 100 });
    }
    function requestReveal() {
      if (!st.snap || st.snap.phase !== 'peek' || st.snap.turn !== myIdx()) return;
      broadcast('rev', { rid: st.rid, cid: st.cid });
      if (isHost()) hostReveal({ rid: st.rid, cid: st.cid });
    }
    function hostReveal(d) {
      if (!isHost() || !S || S.phase !== 'peek') return;
      if (d.rid && d.rid !== st.rid) return;
      if (cidOf(S.turn) !== d.cid) return;
      var res = W.reveal(S);
      if (!res) return;
      SFX.dragStop(0.03);
      var sn = snapOf();
      broadcast('done', { rid: st.rid, snap: sn, result: res, by: d.cid });
      doneApply(sn, res);
    }
    function doneApply(sn, res) {
      if (st.lastDoneRev === sn.rev) return;
      st.lastDoneRev = sn.rev;
      if (sn.rev > st.lastRev) applySnap(sn);
      revealed = true;
      revealFx(res);
    }
    function hostNext() {
      if (!isHost() || !S) return;
      if (S.over) { hostRestart(); return; }
      var r = W.continueGame(S);
      if (!r.ok) return;
      st.third = null;
      pushState('');
    }

    /* ---------------- 공개 연출(모든 화면 공통) ---------------- */
    function revealFx(res) {
      var cover = $('#thirdCover'), wrap = $('#thirdWrap');
      cover.style.clipPath = '';
      cover.style.transform = '';
      cover.style.transition = '';
      cover.classList.add('off');
      cover.innerHTML = '';
      wrap.classList.remove('shake');
      wrap.classList.add('pop');
      $('#peekHint').style.display = 'none';
      SFX.dragStop(0.03);
      SFX.snap(1);
      var win = (res.type === 'win' || res.type === 'ppongWin');
      if (win) { confetti(); vibrate([30, 40, 70]); }
      else if (res.type === 'lose' || res.type === 'ppong' || res.type === 'ppongLose') vibrate([20, 60, 20]);
      renderStatus();
      renderPlayers();
      setTimeout(function () {
        if (win) SFX.win(); else SFX.lose();
        var p = S.players[res.turn] || S.players[0];
        var nm = (p.avatar || '') + ' ' + pName(p);
        var react = '';
        var nxt = S.players[(res.turn + 1) % S.players.length];
        if (res.type === 'fold') {
          renderMsg('', '🙅 ' + nm + ' — ' + t('fold'), t('passHint') + ' · ' + t('pot') + ' ' + fmt(S.pot));
        } else if (win) {
          var others = S.players.filter(function (x, i) { return i !== res.turn; })
            .map(function (x) { return x.avatar + ' ' + pName(x) + ' 🤧'; }).join('  ');
          if (others) react = '<div class="react"><span>' + t('others') + ': ' + others + ' — ' + t('scooped') + '</span></div>';
          renderMsg('win', '🎉 ' + t('win') + ' +' + fmt(res.delta),
            nm + ' · ' + monthLabel(res.m) + ' — ' + (res.type === 'ppongWin' ? t('ppongWin') : t('winSub')) + react);
        } else if (res.type === 'ppong' || res.type === 'ppongLose') {
          react = '<div class="react"><span>🔥 ' + t('potUp') + ' · ' + (nxt.avatar || '') + ' ' + pName(nxt) + '</span></div>';
          renderMsg('ppong', '🤧 ' + t('ppong') + ' −' + fmt(-res.delta),
            nm + ' · ' + monthLabel(res.m) + ' — ' + t('ppongSub') + ' · ' + t('pot') + ' ' + fmt(S.pot) + react);
          snot($('#thirdWrap'));
          potUp();
        } else {
          react = '<div class="react"><span>🔥 ' + t('potUp') + ' · ' + (nxt.avatar || '') + ' ' + pName(nxt) + '</span></div>';
          renderMsg('lose', '🤧 ' + t('lose') + ' −' + fmt(-res.delta),
            nm + ' · ' + monthLabel(res.m) + ' — ' + t('loseSub') + ' · ' + t('pot') + ' ' + fmt(S.pot) + react);
          snot($('#thirdWrap'));
          potUp();
        }
        renderStatus();
        renderPlayers();
        renderActions();
      }, 420);
    }

    /* ---------------- 메시지 라우팅 ---------------- */
    function onMsg(ev, d) {
      if (!d) return;
      if (d.rid && st.rid && d.rid !== st.rid) return;
      if (d.to && d.to !== st.cid) return;
      switch (ev) {
        case 'open':
          if (!isHost()) { st.hostSeen = Date.now(); if (st.pending === 'join' && !st.rid) sayHello(); }
          break;
        case 'hello':
          hostHello(d);
          break;
        case 'welcome':
          if (!isHost()) guestWelcome(d);
          break;
        case 'denied':
          if (!isHost()) guestDenied(d);
          break;
        case 'roster':
          if (!isHost() && d.list) {
            st.roster = d.list;
            if (st.snap) {
              st.snap.players.forEach(function (p, i) { if (d.list[i]) { p.av = d.list[i].av; p.name = d.list[i].nick; } });
              if (S && S.players) S.players.forEach(function (p, i) { if (d.list[i]) { p.avatar = d.list[i].av; p.name = d.list[i].nick; } });
            }
            renderLobby();
          }
          break;
        case 'state':
          if (!isHost()) applySnap(d.snap);
          break;
        case 'third':
          if (d.card) {
            st.third = d.card;
            if (st.snap && st.snap.phase === 'peek') { st.stageKey = ''; onlineStage(st.snap); }
          }
          break;
        case 'act':
          if (d.cid === st.cid) break;
          var lim = (S ? W.betLimits(S).max : 0);
          VOICE.action(d.kind === 'pass' ? 'pass' : (d.amount >= lim && lim > 0 ? 'allin' : 'call'));
          if (isHost()) hostAct(d);
          break;
        case 'peek':
          remotePeek(d);
          break;
        case 'rev':
          hostReveal(d);
          break;
        case 'done':
          if (!isHost() && d.snap && d.result) doneApply(d.snap, d.result);
          break;
        case 'hb':
          if (d.cid === st.hostCid || d.host) st.hostSeen = Date.now();
          st.seen[d.cid] = Date.now();
          break;
        case 'bye':
          hostBye(d);
          break;
        case 'reset':
          if (!isHost()) {
            st.started = false; st.snap = null; st.lastRev = 0; st.third = null; S = null;
            show('lobby'); renderLobby();
          }
          break;
        case 'closed':
          if (!isHost()) guestClosed();
          break;
      }
    }

    function remotePeek(d) {
      if (!st.snap || st.snap.phase !== 'peek') return;
      if (!d.cid || d.cid === st.cid) return;
      if (cidOf(st.snap.turn) !== d.cid) return;
      if (!d.p) {
        if (st.remoteDrag) { st.remoteDrag = false; SFX.dragStop(0.04); applyPeek(0); }
        return;
      }
      if (!st.remoteDrag) {
        st.remoteDrag = true;
        SFX.dragStart();
        $('#thirdCover').style.transition = 'none';
        $('#thirdWrap').style.transition = 'none';
      }
      applyPeek(d.p);
      SFX.dragMove(d.p);
    }

    /* ---------------- 손님 측 처리 ---------------- */
    function guestWelcome(d) {
      if (d.rid) st.rid = d.rid;
      st.hostCid = d.hostCid || st.hostCid;
      st.started = !!d.started;
      if (d.list) st.roster = d.list;
      clearInterval(st.joinTimer); st.joinTimer = null;
      setConn('');
      if (d.ante) ui.ante = d.ante;
      if (typeof d.ppong === 'boolean') ui.ppong = d.ppong;
      if (d.third) st.third = d.third;
      if (d.snap) { applySnap(d.snap); show('game'); }
      else { show('lobby'); renderLobby(); }
      st.hostSeen = Date.now();
    }
    function guestDenied(d) {
      var msg = d.reason === 'dup' ? (ui.lang === 'en' ? 'That nickname is taken.' : '이미 사용 중인 닉네임입니다.')
        : d.reason === 'full' ? (ui.lang === 'en' ? 'Room is full (max 6).' : '방이 가득 찼습니다 (최대 6인).')
          : d.reason === 'started' ? (ui.lang === 'en' ? 'The game already started.' : '이미 게임이 시작된 방입니다.')
            : d.reason === 'nick' ? (ui.lang === 'en' ? 'Enter a nickname.' : '닉네임을 입력해 주세요.')
              : (ui.lang === 'en' ? 'Could not join.' : '입장할 수 없습니다.');
      leave(false);
      hint(msg, true);
    }
    function guestClosed() {
      leave(false);
      hint(ui.lang === 'en' ? 'The host left the room.' : '방장이 방을 닫았습니다.', true);
    }

    /* ---------------- 대기실 ---------------- */
    function esc(v) {
      return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
      });
    }
    function renderLobby() {
      var list = $('lobbyList'), code = $('roomCode');
      if (code) code.textContent = st.code || '----';
      if (!list) return;
      var rows = '';
      st.roster.forEach(function (r) {
        var isH = isHost() ? (r.cid === st.cid) : (r.cid === st.hostCid);
        rows += '<div class="lp' + (isH ? ' host' : '') + '"><span class="av">' + r.av + '</span><span>' +
          esc(r.nick) + (r.cid === st.cid ? ' <b class="me">' + (ui.lang === 'en' ? 'you' : '나') + '</b>' : '') +
          '</span>' + (isH ? '<span class="tag2">' + (ui.lang === 'en' ? 'HOST' : '방장') + '</span>' : '') + '</div>';
      });
      list.innerHTML = rows || '<p class="lhint">' + (ui.lang === 'en' ? 'Waiting for players…' : '참가자를 기다리는 중…') + '</p>';
      var sb = $('hostStartBtn');
      if (sb) {
        if (isHost()) {
          sb.style.display = '';
          sb.disabled = st.roster.length < 2;
          sb.textContent = (ui.lang === 'en' ? 'START' : '게임 시작') + ' (' + st.roster.length + '/6)';
        } else { sb.style.display = 'none'; }
      }
      var sh = $('shareRow'); if (sh) sh.style.display = isHost() ? '' : 'none';
      var w = $('lobbyWait'); if (w) w.style.display = isHost() ? 'none' : '';
    }
    function shareLink() {
      return location.origin + '/wolnambbong.html?room=' + st.code;
    }

    /* ---------------- 방 만들기 / 입장 / 나가기 ---------------- */
    function ensureCfg(cb) {
      if (st.cfg) return cb(true);
      setConn('온라인 설정 확인 중…');
      fetch('/api/wolnambbong/config', { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (!j || !j.configured) { setConn(''); hint('온라인 방을 사용할 수 없습니다(서버 설정 없음).', true); cb(false); return; }
          st.cfg = { url: j.url, key: j.key };
          setConn('');
          cb(true);
        })
        .catch(function () { setConn(''); hint('온라인 설정을 불러오지 못했습니다.', true); cb(false); });
    }
    function nickOrWarn() {
      var inp = $('nickInput');
      var v = normNick(inp ? inp.value : '');
      if (!v) {
        hint(ui.lang === 'en' ? 'Enter a nickname first.' : '닉네임을 먼저 입력해 주세요.', true);
        if (inp) inp.focus();
        return '';
      }
      try { localStorage.setItem('wnb.nick', v); } catch (e) {}
      return v;
    }
    function create() {
      var nick = nickOrWarn(); if (!nick) return;
      ensureCfg(function (ok) {
        if (!ok) return;
        reset(true);
        st.on = true; st.role = 'host'; st.nick = nick; st.pending = 'create';
        st.code = String(rand4()); st.rid = ridc();
        st.roster = [{ cid: st.cid, nick: nick, av: AV[0], seen: Date.now() }];
        st.started = false; st.closed = false;
        show('lobby'); renderLobby();
        connect();
      });
    }
    function join() {
      var nick = nickOrWarn(); if (!nick) return;
      var ci = $('codeInput');
      var code = String(ci ? ci.value : '').replace(/[^0-9]/g, '');
      if (code.length !== 4) {
        hint(ui.lang === 'en' ? 'Enter the 4-digit room code.' : '4자리 방 코드를 입력해 주세요.', true);
        return;
      }
      ensureCfg(function (ok) {
        if (!ok) return;
        reset(true);
        st.on = true; st.role = 'guest'; st.nick = nick; st.pending = 'join';
        st.code = code; st.rid = ''; st.closed = false;
        show('lobby'); renderLobby();
        connect();
        clearInterval(st.joinTimer);
        var tries = 0;
        st.joinTimer = setInterval(function () {
          if (st.joined) sayHello();
          tries++;
          if (tries >= 3) {
            clearInterval(st.joinTimer); st.joinTimer = null;
            if (!st.rid) {
              leave(false);
              hint(ui.lang === 'en' ? 'Room not found — check the code.' : '방을 찾을 수 없습니다 — 코드를 확인해 주세요.', true);
            }
          }
        }, 2200);
      });
    }
    function hostStart() {
      if (!isHost() || st.roster.length < 2) return;
      var names = st.roster.map(function (r) { return r.nick; });
      S = W.newGame({ mode: 'pass', ante: ui.ante, ppongDouble: ui.ppong, count: names.length, names: names, rng: Math.random });
      st.started = true; st.snap = null; st.lastRev = 0; st.third = null;
      var sn = snapOf();
      broadcast('state', { rid: st.rid, snap: sn });
      applySnap(sn);
    }
    function hostRestart() {
      if (!isHost()) return;
      st.started = false; S = null; st.snap = null; st.lastRev = 0; st.third = null;
      broadcast('reset', { rid: st.rid });
      show('lobby'); renderLobby();
    }
    function reset(keepCfg) {
      try { if (st.ws) st.ws.close(); } catch (e) {}
      clearInterval(st.hbTimer); clearInterval(st.tickTimer); clearInterval(st.joinTimer);
      st.on = false; st.ws = null; st.joined = false; st.closed = true;
      st.code = ''; st.rid = ''; st.role = ''; st.roster = []; st.started = false;
      st.snap = null; st.third = null; st.lastRev = 0; st.lastDoneRev = 0; st.stageKey = '';
      st.hostCid = ''; st.retry = 0; st.remoteDrag = false; st.rev = 0;
      setConn('');
      if (!keepCfg) st.cfg = null;
    }
    function leave(withBye) {
      if (withBye && st.joined) {
        if (isHost()) broadcast('closed', { rid: st.rid, reason: 'host-left' });
        else broadcast('bye', { rid: st.rid, cid: st.cid });
      }
      reset(true);
      st.pending = '';
      S = null;
      show('setup');
      ui.mode = 'online';
      applyStatic();
    }

    /* ---------------- 하트비트/감시 ---------------- */
    function startTicker() {
      if (st.tickTimer) return;
      st.tickTimer = setInterval(function () {
        if (!st.on) return;
        var now = Date.now();
        if (st.joined) broadcast('hb', { rid: st.rid, cid: st.cid, host: isHost() });
        if (isHost() && !st.started) {
          var changed = false;
          for (var i = st.roster.length - 1; i >= 0; i--) {
            if (st.roster[i].cid !== st.cid && now - (st.roster[i].seen || 0) > 20000) { st.roster.splice(i, 1); changed = true; }
          }
          if (changed) { broadcast('roster', { rid: st.rid, list: rosterPub() }); renderLobby(); }
        }
        if (!isHost() && st.hostSeen && now - st.hostSeen > 16000) {
          setConn(ui.lang === 'en' ? 'Waiting for the host to reconnect…' : '방장 연결을 기다리는 중…');
        }
      }, 5000);
    }

    /* ---------------- 초기화 ---------------- */
    function prepare() {
      if (st.cid) { st.on = true; startTicker(); return; }
      var cid = '';
      try { cid = sessionStorage.getItem('wnb.cid') || ''; } catch (e) {}
      if (!cid) {
        cid = ridc() + ridc();
        try { sessionStorage.setItem('wnb.cid', cid); } catch (e) {}
      }
      st.cid = cid;
      var nk = '';
      try { nk = localStorage.getItem('wnb.nick') || ''; } catch (e) {}
      if (nk && $('nickInput') && !$('nickInput').value) $('nickInput').value = nk;
      var q = '';
      try { q = new URLSearchParams(location.search).get('room') || ''; } catch (e) {}
      if (/^\d{4}$/.test(q)) {
        if ($('codeInput')) $('codeInput').value = q;
        if (!nk && $('nickInput')) $('nickInput').focus();
        hint(ui.lang === 'en' ? 'Invite link — enter a nickname and press Join.' : '초대 링크로 접속했습니다. 닉네임을 넣고 [입장]을 눌러 주세요.');
      }
      st.on = true;
      startTicker();
    }
    function isOn() { return !!(st.on && st.pending); }
    function canPeek() {
      return !!(st.snap && st.snap.phase === 'peek' && st.snap.turn === myIdx() && !busy && !revealed);
    }
    function share() {
      var link = shareLink();
      var done = function () { hint((ui.lang === 'en' ? 'Link copied: ' : '초대 링크 복사됨: ') + link); };
      try {
        if (navigator.share) {
          navigator.share({ title: '월남뽕 · 온라인 방 ' + st.code, text: (ui.lang === 'en' ? 'Join my Wol-nam-bbong room: ' : '월남뽕 온라인 방에 들어와: '), url: link }).catch(function () {});
          return;
        }
      } catch (e) {}
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(link).then(done, function () { hint(link); });
          return;
        }
      } catch (e) {}
      hint(link);
    }

    return {
      prepare: prepare, isOn: isOn, isHost: isHost, canPeek: canPeek,
      create: create, join: join, leave: leave, hostStart: hostStart, hostRestart: hostRestart,
      hostNext: hostNext, share: share, sendPeek: sendPeek, requestReveal: requestReveal,
      renderLobby: renderLobby, onlineActions: onlineActions, revealFx: revealFx,
      applySnap: applySnap, state: function () { return st; }
    };
  })();

  function bind() {
    $('#langBtn').onclick = function () {
      ui.lang = ui.lang === 'en' ? 'kr' : 'en';
      applyStatic(); renderHero();
      if (S) { renderStatus(); renderPlayers(); renderBoard(); renderActions(); }
      renderMsg(lastMsg.cls, lastMsg.l1.replace(/undefined/g, ''), lastMsg.l2);
    };
    $('#langBtn2').onclick = $('#langBtn').onclick;
    $('#gearBtn').onclick = function () { $('#sheet').classList.add('on'); };
    $('#closeSheet').onclick = function () { $('#sheet').classList.remove('on'); };
    $('#restartBtn').onclick = function () { $('#sheet').classList.remove('on'); backToSetup(); };
    $('#ppongSwitch').onclick = $('#ppongSwitch2').onclick = function () {
      ui.ppong = !ui.ppong;
      if (S) S.ppongDouble = ui.ppong;
      applyStatic();
    };
    document.querySelectorAll('.mode').forEach(function (b) {
      b.onclick = function () {

    $('#plus').onclick = function () { ui.count = Math.min(6, ui.count + 1); applyStatic(); };
    $('#startBtn').onclick = startGame;

    $('#sfxBtn').onclick = function () {
      SFX.setOn(!SFX.isOn());
      VOICE.setOn(SFX.isOn());
      var b = $('#sfxBtn');
      b.textContent = SFX.isOn() ? '🔊' : '🔇';
      b.title = SFX.isOn() ? '소리 켜짐' : '소리 꺼짐';
      if (SFX.isOn()) SFX.tick();
    };
    /* 모바일 브라우저 AudioContext 잠금 해제 — 첫 터치에서 1회 */
    if (typeof document !== 'undefined' && document && document.addEventListener) {
      document.addEventListener('pointerdown', function () { SFX.unlock(); }, { once: true, passive: true });
    }

    var w = $('#thirdWrap');

    /* ---- 온라인 방 ---- */
    var cbtn = $('#createBtn');
    if (cbtn) cbtn.onclick = function () { ON.create(); };
    var jbtn = $('#joinBtn');
    if (jbtn) jbtn.onclick = function () { ON.join(); };
    var sbtn = $('#shareBtn');
    if (sbtn) sbtn.onclick = function () { ON.share(); };
    var lbtn = $('#leaveBtn');
    if (lbtn) lbtn.onclick = function () { ON.leave(true); };
    var hs = $('#hostStartBtn');
    if (hs) hs.onclick = function () { ON.hostStart(); };
    var ci = $('#codeInput');
    if (ci) {
      ci.oninput = function () { this.value = String(this.value).replace(/[^0-9]/g, '').slice(0, 4); };
      ci.onkeydown = function (e) { if (e.key === 'Enter') ON.join(); };
    }
    var ni = $('#nickInput');
    if (ni) ni.onkeydown = function (e) { if (e.key === 'Enter') { if ($('#codeInput') && $('#codeInput').value.length === 4) ON.join(); else ON.create(); } };
  }

  fxInit();
  bind();
  applyStatic();
  renderHero();
})();
</script>
</body>
</html>
